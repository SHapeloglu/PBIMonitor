version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pbimonitor-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pbimonitor_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pbimonitor-net
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: pbimonitor-web
    restart: always
    ports:
      - "8003:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pbimonitor-net

  scheduler:
    build: .
    container_name: pbimonitor-scheduler
    restart: always
    command: python scheduler.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pbimonitor-net

volumes:
  pbimonitor_db_data:

networks:
  pbimonitor-net:
    driver: bridge
