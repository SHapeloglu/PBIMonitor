<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBI Monitor — Kayıt Ol</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1A1A2E;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            width: 400px;
            background: #2D2D4E;
            border: 1px solid #3D3D6B;
            border-radius: 12px;
            padding: 40px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: #F2C811;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .logo-text { font-size: 20px; font-weight: 600; }
        .logo-sub { font-size: 12px; color: #A0A0C0; }
        h2 { font-size: 18px; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #A0A0C0; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        label { font-size: 12px; color: #A0A0C0; font-weight: 500; display: block; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 10px 14px;
            background: #1A1A2E;
            border: 1px solid #3D3D6B;
            border-radius: 4px;
            font-size: 13px;
            color: #fff;
        }
        input:focus { outline: none; border-color: #F2C811; }
        .btn {
            width: 100%;
            padding: 10px;
            background: #F2C811;
            color: #1A1A2E;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:hover { opacity: 0.9; }
        .error {
            background: rgba(232,17,35,0.15);
            color: #E81123;
            border: 1px solid rgba(232,17,35,0.3);
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #A0A0C0;
        }
        .footer-link a { color: #F2C811; text-decoration: none; }
        .info {
            background: rgba(242,200,17,0.1);
            border: 1px solid rgba(242,200,17,0.3);
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 12px;
            color: #A0A0C0;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo">
        <div class="logo-icon">⚡</div>
        <div>
            <div class="logo-text">PBI Monitor</div>
            <div class="logo-sub">Power BI İzleme Platformu</div>
        </div>
    </div>

    <h2>Hesap Oluştur</h2>
    <p class="subtitle">PBI Monitor'e hoş geldiniz</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="info">
        Kayıt olduktan sonra Power BI hesabınızı bağlayabilirsiniz.
    </div>

    <form method="POST">
        <div class="form-group">
            <label>Email Adresi</label>
            <input type="email" name="email" placeholder="ornek@firma.com" required>
        </div>
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
            <label>Şifre Tekrar</label>
            <input type="password" name="password2" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Kayıt Ol</button>
    </form>

    <div class="footer-link">
        Zaten hesabınız var mı? <a href="/login">Giriş Yap</a>
    </div>
</div>
</body>
</html>
